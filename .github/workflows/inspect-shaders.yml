name: Inspect uploaded shaders

on:
  push:
    paths:
      - ".github/workflows/inspect-shaders.yml"
      - "shaders.rar"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract shader archive (retain valid entries)
        shell: bash
        run: |
          set -uo pipefail
          sudo apt-get update
          sudo apt-get install -y unar
          mkdir -p extracted-shaders
          result=0
          unar -f -o extracted-shaders shaders.rar > extraction.log 2>&1 || result=$?
          cat extraction.log
          echo "unar exit code: $result"
          find extracted-shaders -type f -print | sort > extracted-shaders/FILE-LIST.txt
          test -s "extracted-shaders/shaders/core/wetfloor/floor.fsh"
          test -s "extracted-shaders/shaders/core/wetfloor/screen.fsh"
          echo "Extracted file count:"
          find extracted-shaders -type f | wc -l
          echo "Wet-floor shader files:"
          find extracted-shaders/shaders/core/wetfloor -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          echo "Checksum failures are documented above; required floor/screen GLSL were extracted."

      - name: Upload extracted shader archive
        uses: actions/upload-artifact@v4
        with:
          name: Extracted-Uploaded-Shaders
          path: |
            extracted-shaders/
            extraction.log
          if-no-files-found: error
          retention-days: 7
